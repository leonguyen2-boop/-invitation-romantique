<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Une petite invitation ❤️</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root{
    --cream:#f8f3ea;
    --paper:#fffdf9;
    --gold:#caa76a;
    --gold2:#e2c489;
    --wine:#7b2338;
    --wine-dark:#5d1829;
    --shadow:0 20px 50px rgba(0,0,0,.12);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:
    radial-gradient(circle at top,#fff,#f8f3ea 60%);
    font-family:'Cormorant Garamond',serif;
    padding:20px;
    color:var(--wine-dark);
}

.card{
    width:min(700px,100%);
    background:var(--paper);
    border-radius:22px;
    box-shadow:var(--shadow);
    padding:35px 25px 45px;
    position:relative;
    overflow:hidden;
    transition:.5s;
}

.card::before{
    content:"";
    position:absolute;
    inset:0;
    border:2px solid rgba(202,167,106,.18);
    border-radius:22px;
    pointer-events:none;
}

.step{
    display:none;
    animation:fade .6s ease;
    min-height:430px;
    position:relative;
}

.step.active{
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
}

@keyframes fade{
from{opacity:0;transform:translateY(15px);}
to{opacity:1;transform:none;}
}

/* ---------------- ENVELOPPE ---------------- */

.envelope{
    position:relative;
    width:280px;
    height:185px;
    margin-bottom:25px;
}

.base{
    position:absolute;
    inset:0;
    background:#eadbc7;
    border-radius:0 0 12px 12px;
}

.left,
.right{
    position:absolute;
    bottom:0;
    width:50%;
    height:100%;
    background:#f1e5d7;
}

.left{
    left:0;
    clip-path:polygon(0 100%,100% 0,100% 100%);
}

.right{
    right:0;
    clip-path:polygon(0 0,100% 100%,0 100%);
}

.flap{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:#f5ebdf;
    clip-path:polygon(0 0,100% 0,50% 62%);
    transform-origin:top;
    transition:1s;
    z-index:4;
}

.envelope.open .flap{
    transform:rotateX(180deg);
}

.seal{
    position:absolute;
    left:50%;
    top:57%;
    transform:translate(-50%,-50%);
    width:58px;
    height:58px;
    border-radius:50%;
    background:linear-gradient(145deg,var(--wine),var(--wine-dark));
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:28px;
    z-index:5;
    box-shadow:0 5px 15px rgba(0,0,0,.2);
}

.tap{
    color:var(--wine);
    font-size:1.5rem;
}

/* ---------------- TEXTE ---------------- */

h1{
    font-size:2.7rem;
    color:var(--wine);
    margin-bottom:10px;
}

.subtitle{
    font-style:italic;
    opacity:.75;
    font-size:1.15rem;
    margin-bottom:35px;
}

.button-zone{
    position:relative;
    width:100%;
    max-width:420px;
    height:180px;
}

.btn{
    position:absolute;
    font-family:Inter,sans-serif;
    border:none;
    cursor:pointer;
    transition:.35s;
    border-radius:999px;
    font-weight:600;
    user-select:none;
}

#yesBtn{
    left:35%;
    top:40px;
    background:var(--wine);
    color:white;
    padding:14px 34px;
    font-size:1.05rem;
}

#yesBtn:hover{
    background:#621c2d;
}

#noBtn{
    left:62%;
    top:42px;
    background:white;
    color:var(--wine);
    border:2px solid var(--wine);
    padding:12px 28px;
    font-size:1rem;
}

.message{
    position:absolute;
    bottom:15px;
    width:100%;
    text-align:center;
    font-size:1.25rem;
    color:#8b5b67;
}

/* ---------------- HORAIRES ---------------- */

.movie{
    font-size:2.3rem;
    margin-bottom:25px;
    color:var(--wine);
}

.slots{
    display:grid;
    gap:16px;
    width:min(420px,100%);
}

.slot{
    background:#fff;
    border:2px solid var(--gold);
    border-radius:14px;
    padding:16px;
    cursor:pointer;
    transition:.3s;
    font-size:1.35rem;
}

.slot:hover{
    background:var(--wine);
    color:white;
    transform:translateY(-2px);
}

.confirm{
    font-size:2.1rem;
    color:var(--wine);
    margin-bottom:15px;
}

.small{
    font-size:1.7rem;
    opacity:.8;
}

@media(max-width:600px){

h1{
    font-size:2.1rem;
}

.subtitle{
    font-size:1rem;
}

.movie{
    font-size:1.8rem;
}

.confirm{
    font-size:1.6rem;
}

.small{
    font-size:1.35rem;
}

.button-zone{
    height:220px;
}

#yesBtn{
    left:20%;
}

#noBtn{
    left:60%;
}

.slot{
    font-size:1.15rem;
}

}
</style>
</head>
<body>

<div class="card">

    <!-- Étape 1 -->
    <section class="step active" id="step1">
        <div class="envelope" id="envelope">
            <div class="base"></div>
            <div class="left"></div>
            <div class="right"></div>
            <div class="flap"></div>
            <div class="seal">❤</div>
        </div>

        <div class="tap">Touche la lettre</div>
    </section>

    <!-- Étape 2 -->
    <section class="step" id="step2">

        <h1>Ça te dit un date avec moi ?</h1>

        <div class="subtitle">
            (ça sert à rien de dire non, mais tu peux essayer)
        </div>

        <div class="button-zone" id="zone">
            <button id="yesBtn" class="btn">Oui ❤️</button>
            <button id="noBtn" class="btn">Non</button>

            <div class="message" id="message"></div>
        </div>

    </section>

    <!-- Étape 3 -->
    <section class="step" id="step3">

        <div class="movie">Spider-Man — Nouveau film</div>

        <div class="slots">
            <div class="slot">Vendredi 31 juillet 14:30</div>
            <div class="slot">Vendredi 31 juillet 18:00</div>
            <div class="slot">Vendredi 31 juillet 13:50</div>
            <div class="slot">Vendredi 31 juillet 17:00</div>
        </div>

    </section>

    <!-- Étape 4 -->
    <section class="step" id="step4">

        <div class="confirm" id="confirmText"></div>
        <div class="small">j’ai déjà hâte ❤️</div>

    </section>

</div>

<script>

const step1=document.getElementById("step1");
const step2=document.getElementById("step2");
const step3=document.getElementById("step3");
const step4=document.getElementById("step4");

const envelope=document.getElementById("envelope");

function show(step){
    document.querySelectorAll(".step").forEach(s=>s.classList.remove("active"));
    step.classList.add("active");
}

envelope.addEventListener("click",()=>{
    envelope.classList.add("open");

    setTimeout(()=>{
        show(step2);
    },950);
});

const yes=document.getElementById("yesBtn");
const no=document.getElementById("noBtn");
const zone=document.getElementById("zone");
const msg=document.getElementById("message");

const texts=[
"Essaie encore 😏",
"Tu es sûr(e) ?",
"Réfléchis bien 👀",
"Le Oui est plus sympa ❤️",
"Allez... clique sur Oui ✨"
];

let noClicks=0;
let yesSize=1;

no.addEventListener("click",()=>{

    noClicks++;

    msg.textContent=texts[Math.min(noClicks-1,texts.length-1)];

    yesSize+=0.18;
    yes.style.fontSize=(1.05*yesSize)+"rem";
    yes.style.padding=(14*yesSize)+"px "+(34*yesSize)+"px";

    no.style.transform="scale("+(1-noClicks*0.12)+")";
    no.style.opacity=Math.max(.15,1-noClicks*0.18);

    const maxX=zone.clientWidth-no.offsetWidth;
    const maxY=zone.clientHeight-no.offsetHeight-55;

    no.style.left=Math.random()*maxX+"px";
    no.style.top=Math.random()*Math.max(20,maxY)+"px";

    if(noClicks>=5){
        no.disabled=true;
        no.style.pointerEvents="none";
        no.textContent="Trop tard 😌";
        msg.textContent="Bon... il ne reste plus qu'une option ❤️";
    }

});

yes.addEventListener("click",()=>{
    show(step3);
});

document.querySelectorAll(".slot").forEach(slot=>{
    slot.addEventListener("click",()=>{

        const txt=slot.textContent;
        const parts=txt.split(" ");

        const heure=parts[parts.length-1];
        const jour=parts.slice(0,parts.length-1).join(" ");

        document.getElementById("confirmText").innerHTML=
        `okkk c noté !<br><strong>${jour}</strong> à <strong>${heure}</strong>`;

        show(step4);

    });
});

</script>

</body>
</html>
